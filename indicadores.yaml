  - {nombre: "Préstamos por tipo de deudor (aprox. Familias/Empresas)", bloque: monetario_financiero, grupo: "Crédito", vista: overlay, series: ["Préstamos a Familias (Consumo + Garantía real)", "Préstamos a Empresas (Comerciales)"], unidad: "millones de $", neutral: true, nota: "El BCRA no publica en datos.gob.ar una apertura oficial de préstamos por tipo de deudor (Familias/Empresas); se aproxima sumando líneas de crédito por su uso habitual: Familias ≈ Consumo (personales + tarjetas) + Garantía real (hipotecarios + prendarios); Empresas ≈ Comerciales (adelantos + documentos). Verificado: la suma de las 3 líneas reproduce exactamente el total de 'Préstamos al sector privado' (91.1_PEFPC_0_0_35), sin residuo."}
