  # -- Capacidad de compra: RIPTE (salario PESOS, no un índice como el de Salario real de
  #    arriba) sobre el costo de la Canasta Básica Total nacional por adulto equivalente.
  #    IDs verificados en vivo contra el catálogo real de datos.gob.ar antes de agregar
  #    (Regla dura #1): 158.1_REPTE_0_0_5 (RIPTE) y 150.1_CSTA_BATAL_0_D_20 (CBT) --
  - {nombre: "Capacidad de compra del salario (RIPTE / CBT)", bloque: social, grupo: "Social", calculo: ratio, numerador_id: "158.1_REPTE_0_0_5", denominador_id: "150.1_CSTA_BATAL_0_D_20", unidad: "canastas", sube_es_bueno: true, solo_componente: true, nota: "RIPTE (Remuneración Imponible Promedio de los Trabajadores Estables, Secretaría de Trabajo, Empleo y Seguridad Social del Ministerio de Capital Humano, vía datos.gob.ar, 158.1_REPTE_0_0_5, pesos corrientes) dividido por el costo de la Canasta Básica Total nacional por adulto equivalente (INDEC, vía datos.gob.ar, 150.1_CSTA_BATAL_0_D_20, pesos corrientes). El resultado se lee como 'cuántas Canastas Básicas Totales (por adulto equivalente) equivalen a un RIPTE promedio' -- NO es una medida de cuántas familias puede sostener un salario: RIPTE es el promedio de trabajadores REGISTRADOS y ESTABLES (formales, con continuidad laboral), no de toda la fuerza laboral (excluye informales, desocupados y trabajadores con altas/bajas dentro del período); la CBT está pensada para un adulto equivalente (unidad de consumo per cápita ajustada por edad/sexo), no para una familia tipo completa. Se usa RIPTE en vez del Índice de Salarios (dataset 149, el que alimenta 'Salario real' más arriba) porque ese índice está en base 100 (oct-2016), no en pesos, así que no se puede dividir directamente por un costo en pesos como la CBT."}
  - {nombre: "Salario real y capacidad de compra", bloque: social, grupo: "Social", vista: combo_2lineas, linea_izq: "Salario real (deflactado por IPC)", linea_der: "Capacidad de compra del salario (RIPTE / CBT)", unidad_izq: "índice base 100 al inicio", unidad_der: "canastas", sube_es_bueno: true, nota: "Dos series conceptualmente distintas, en dos ejes a propósito: 'Salario real' (eje izquierdo) es un ÍNDICE rebasado a 100 en su primer período disponible -- mide TRAYECTORIA relativa (¿mejoró o empeoró desde el punto de partida?), no un nivel concreto. 'Capacidad de compra' (eje derecho, RIPTE/CBT) es un NIVEL concreto en 'canastas' -- cuántas Canastas Básicas Totales equivale un RIPTE promedio en cada momento. No se pueden superponer en el mismo eje sin que una aplaste visualmente a la otra. Ver la nota de cada serie por separado ('Salario real (deflactado por IPC)' y 'Capacidad de compra del salario (RIPTE / CBT)') para el detalle metodológico completo de cada una."}

