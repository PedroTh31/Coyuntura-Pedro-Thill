  #    Monetarias del BCRA v4.0, categoría "Depósitos por tipo de titular" -- no está en
  #    datos.gob.ar. idVariable verificado en vivo contra el catálogo real antes de agregarlo.
  - {nombre: "Depósitos: sector privado no financiero", bloque: mercados, grupo: "Crédito", fuente: bcra, id_variable: 981, unidad: "millones de $", factor: 0.001, solo_componente: true}
  - {nombre: "Depósitos: sector público", bloque: mercados, grupo: "Crédito", fuente: bcra, id_variable: 209, unidad: "millones de $", factor: 0.001, solo_componente: true}
  - {nombre: "Depósitos bancarios (privado vs. público)", bloque: mercados, grupo: "Crédito", vista: overlay, series: ["Depósitos: sector privado no financiero", "Depósitos: sector público"], unidad: "millones de $", neutral: true, nota: "BCRA, API de Estadísticas Monetarias v4.0 (api.bcra.gob.ar/estadisticas/v4.0/monetarias), categoría 'Depósitos por tipo de titular' -- no está en datos.gob.ar. 'Sector privado' (idVariable 981) es un total oficial ya combinado en moneda local + extranjera (valuada). 'Sector público' (idVariable 209) es sólo depósitos de gobiernos nacional/provincial/municipal/corporaciones intergubernamentales EN MONEDA LOCAL (ver 'Depósitos: sector público en dólares' para el componente en moneda extranjera). La fuente tiene historia mensual desde 1999/1989 respectivamente, pero fetch_bcra() sólo trae los últimos ~2 años por corrida (misma limitación ya documentada en 'Reservas ajustadas'): la ventana se desliza con la fecha actual, no crece hacia atrás con el tiempo."}
  - {nombre: "Depósitos: sector privado en pesos", bloque: mercados, grupo: "Crédito", fuente: bcra, id_variable: 100, unidad: "millones de $", factor: 0.001, neutral: true, nota: "BCRA, API de Estadísticas Monetarias v4.0, idVariable 100 ('Depósitos del sector privado no financiero', moneda local, incluye cedros), diaria. Componente en pesos de 'Depósitos: sector privado no financiero' (que es el total ya combinado en ambas monedas)."}
  - {nombre: "Depósitos: sector privado en dólares", bloque: mercados, grupo: "Crédito", fuente: bcra, id_variable: 104, unidad: "millones de USD", neutral: true, solo_componente: true, nota: "BCRA, API de Estadísticas Monetarias v4.0, idVariable 104 ('Depósitos del sector privado no financiero', moneda extranjera), diaria, en dólares (no convertido a pesos)."}
  - {nombre: "Depósitos: sector público en dólares", bloque: mercados, grupo: "Crédito", fuente: bcra, id_variable: 229, unidad: "millones de USD", neutral: true, solo_componente: true, nota: "BCRA, API de Estadísticas Monetarias v4.0, idVariable 229 ('Depósitos de los gobiernos nacional, provinciales, municipales y corporaciones intergubernamentales', moneda extranjera), mensual, en dólares. Componente en dólares de 'Depósitos: sector público' (que sólo cubre el componente en pesos, ver su nota)."}
  - {nombre: "Depósitos en moneda extranjera (privado y público)", bloque: mercados, grupo: "Crédito", vista: overlay, series: ["Depósitos: sector privado en dólares", "Depósitos: sector público en dólares"], unidad: "millones de USD", neutral: true, nota: "Depósitos denominados en dólares (no convertidos, valor en USD directo), privado (idVariable 104) y público (idVariable 229), BCRA. Mostrados en un overlay separado del resto de 'Depósitos' porque están en una moneda distinta (USD) de las demás tarjetas de este grupo (pesos): mezclarlos en un mismo eje sin convertir sería engañoso."}

  # -- Morosidad (irregularidad de cartera): serie directa del BCRA (dataset 332, "Principales
  #    Indicadores del Sistema Financiero"), no hace falta rascar Excel. La fuente etiqueta la
  #    unidad como "millones de pesos" pero es un error de metadata: es un ratio %, verificado
  #    con 16 años de historia (2010-2026) siempre acotada entre 1,4% y 7,3% (nunca escaló a
  #    miles/millones pese a la inflación acumulada del período, como sí lo hacen las series
  #    realmente en pesos de este proyecto) --
  - {nombre: "Morosidad: sistema financiero", bloque: mercados, grupo: "Crédito", fuente: datos_gob, id: "332.2_SISTEMA_FIADA__53", unidad: "%", solo_componente: true}
  - {nombre: "Morosidad: bancos públicos", bloque: mercados, grupo: "Crédito", fuente: datos_gob, id: "332.2_BANCOS_PUBADA__55", unidad: "%", solo_componente: true}
  - {nombre: "Morosidad: bancos privados", bloque: mercados, grupo: "Crédito", fuente: datos_gob, id: "332.2_BANCOS_PRIADA__51", unidad: "%", solo_componente: true}
  - {nombre: "Morosidad del crédito (irregularidad de cartera)", bloque: mercados, grupo: "Crédito", vista: overlay, series: ["Morosidad: sistema financiero", "Morosidad: bancos públicos", "Morosidad: bancos privados"], unidad: "%", nota: "Ratio de cartera irregular sobre financiaciones al sector privado (BCRA, dataset 332). La fuente etiqueta la unidad como 'millones de pesos' en su metadata; es un error, se trata de un ratio %."}
  # -- Morosidad de Familias por línea de crédito: NO está en datos.gob.ar (dataset 332 sólo
  #    desagrega por tipo de banco, no por tipo de deudor/línea). Sale del Anexo estadístico
  #    (Excel) del Informe sobre Bancos mensual del BCRA, hoja "Calidad de Cartera (por
  #    líneas)", sección fija "2. Familias - Total" (ver fetch_bcra_morosidad_lineas en
  #    fetchers.py) --
  - {nombre: "Morosidad: Familias (total)", bloque: mercados, grupo: "Crédito", fuente: bcra_morosidad_lineas, serie: "Cartera irregular total", unidad: "%", solo_componente: true}
  - {nombre: "Morosidad: Familias — Personales", bloque: mercados, grupo: "Crédito", fuente: bcra_morosidad_lineas, serie: "Personales", unidad: "%", solo_componente: true}
  - {nombre: "Morosidad: Familias — Tarjetas de crédito", bloque: mercados, grupo: "Crédito", fuente: bcra_morosidad_lineas, serie: "Tarjetas de crédito", unidad: "%", solo_componente: true}
  - {nombre: "Morosidad de Familias por línea de crédito", bloque: mercados, grupo: "Crédito", vista: overlay, series: ["Morosidad: Familias (total)", "Morosidad: Familias — Personales", "Morosidad: Familias — Tarjetas de crédito"], unidad: "%", subtitulo: "Cartera irregular de Familias: total y por línea (Personales, Tarjetas)", nota: "Ratio de cartera irregular (%) de la cartera de Familias (personas humanas), BCRA. Fuente: Anexo estadístico del Informe sobre Bancos mensual (bcra.gob.ar/informe-sobre-bancos/), hoja 'Calidad de Cartera (por líneas)', sección '2. Familias - Total'. A diferencia de 'Morosidad del crédito' de más arriba (desagregada por tipo de BANCO: sistema/públicos/privados, dataset 332 de datos.gob.ar), acá la desagregación es por tipo de DEUDOR/línea de crédito dentro de Familias -- el BCRA no publica esta apertura en datos.gob.ar, sólo en este anexo. El archivo se recachea como máximo una vez por semana (se actualiza ~1 vez por mes)."}

  # -- Punto 3: TAMAR bancos privados (idVariable 44) -- variante que efectivamente referencian
  #    los bonos duales, confirmada contra el texto legal de las Resoluciones Conjuntas de
  #    Finanzas/Hacienda (Ronda 1). No reemplaza a "Tasa TAMAR (total bancos)" de arriba (135,
  #    referencia general de mercado): son dos usos distintos, documentado en ambas notas.
  - {nombre: "Tasa TAMAR bancos privados (bonos duales)", bloque: mercados, grupo: "Tasas y CER", fuente: bcra, id_variable: 44, unidad: "% TNA", desde: "2026-01-01", neutral: true, nota: "TAMAR bancos privados, % nominal anual, API de Estadísticas Monetarias del BCRA v4.0 (idVariable 44) -- confirmada contra el texto legal de las Resoluciones Conjuntas de Finanzas/Hacienda (ej. Resolución Conjunta 25/2026, Boletín Oficial: 'TAMAR promedio bancos privados') como la variante que efectivamente referencian los bonos duales (TTM26, TTJ26, etc.). Distinta de 'Tasa TAMAR (total bancos)' (idVariable 135), que es la referencia general de mercado ya mostrada en esta pestaña -- no intercambiables."}

