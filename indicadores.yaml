ra la tarjeta puede ir 1-2 trimestres detrás del último dato del EMAE mensual sin que sea un problema del pipeline ni de la caché, es la cadencia real de publicación de la fuente. Sin cerca de Tukey ni toggle de zoom: cada sector tiene su propia posición en el eje X, no hay superposición posible como en la versión original de burbujas de dos ejes continuos."}

