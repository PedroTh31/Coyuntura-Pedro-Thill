  - {nombre: "Resultado primario (Sector Público Nacional)", bloque: fiscal, grupo: "Fiscal", fuente: datos_gob, id: "379.9_RESULTADO_017__31_73", unidad: "millones de $", solo_componente: true}
  - {nombre: "Resultado financiero (Sector Público Nacional)", bloque: fiscal, grupo: "Fiscal", fuente: datos_gob, id: "379.9_RESULTADO_017__18_38", unidad: "millones de $", solo_componente: true}
  - {nombre: "Resultado fiscal (primario y financiero)", bloque: fiscal, grupo: "Fiscal", vista: overlay, barras: true, series: ["Resultado primario (Sector Público Nacional)", "Resultado financiero (Sector Público Nacional)"], unidad: "millones de $", sube_es_bueno: true, nota: "Esquema Ahorro-Inversión-Financiamiento del Sector Público Nacional, Base Caja (Secretaría de Hacienda, Ministerio de Economía, vía datos.gob.ar). Resultado primario = ingresos totales menos gastos primarios (sin intereses de deuda). Resultado financiero = resultado primario menos intereses de deuda pagados. Valores mensuales sin desestacionalizar: la dinámica de ingresos/gastos del Sector Público tiene estacionalidad propia (ej. aguinaldo en junio/diciembre, recaudación de Bienes Personales a mitad de año), así que se recomienda mirar la tendencia de varios meses o la comparación interanual antes de sacar conclusiones de un solo mes."}
  - {nombre: "Superávit gemelos (fiscal y comercial)", bloque: fiscal, grupo: "Fiscal", vista: combo_barras_linea, barras: [{serie: "Resultado primario (Sector Público Nacional)"}, {serie: "Resultado financiero (Sector Público Nacional)"}], linea: "Saldo comercial", unidad: "millones de $", unidad_linea: "millones de USD", subtitulo: "Resultado fiscal (barras, pesos) vs. saldo comercial de bienes (línea, USD)", nota: "Barras: resultado primario y financiero del Sector Público Nacional (ver 'Resultado fiscal (primario y financiero)'), en pesos. Línea: saldo comercial de BIENES (mismo indicador que ya se muestra en Comercio exterior), en dólares -- es un PROXY del resultado del sector externo, no la cuenta corriente completa: la cuenta corriente (que además de bienes incluye servicios, rentas y transferencias) es trimestral (Balance de Pagos, INDEC) y de publicación más lenta, mientras que el comercial de bienes es mensual y permite cruzarlo con el fiscal en la misma frecuencia. Dos monedas distintas en el mismo gráfico (pesos vs. dólares) a propósito: no hay un tipo de cambio único no distorsionado para convertir uno al otro sin introducir un supuesto adicional -- se muestran los dos ejes por separado."}
  - {nombre: "Resultado primario acumulado 12 meses", bloque: fiscal, grupo: "Fiscal", calculo: acumulado_12m, base_id: "379.9_RESULTADO_017__31_73", unidad: "millones de $", solo_componente: true, nota: "Suma móvil de los últimos 12 meses del resultado primario del Sector Público Nacional (Secretaría de Hacienda, vía datos.gob.ar, 379.9_RESULTADO_017__31_73)."}
  - {nombre: "¿El mercado premia la mejora fiscal?", bloque: fiscal, grupo: "Fiscal", vista: combo_barras_linea, barras: [{serie: "Resultado primario acumulado 12 meses"}], linea: "Riesgo país (EMBI)", unidad: "millones de $", unidad_linea: "puntos básicos", subtitulo: "Resultado primario acumulado de 12 meses vs. riesgo país", nota: "Barras: resultado primario del Sector Público Nacional acumulado en los últimos 12 meses (suma móvil, ver 'Resultado primario acumulado 12 meses'), en pesos. Línea: Riesgo país (EMBI+ Argentina), en puntos básicos. Cruza la tendencia de mediano plazo de la mejora/deterioro fiscal contra cómo la está pricing el mercado de bonos -- no implica causalidad ni que el mercado reaccione sólo a esto, es una comparación visual de dos series con lógicas de determinación distintas."}
  - {nombre: "Intereses netos de deuda pública", bloque: fiscal, grupo: "Fiscal", fuente: datos_gob, id: "379.9_GTOS_CORR_017__40_84", unidad: "millones de $", solo_componente: true}
  - {nombre: "Resultado primario vs. intereses de deuda", bloque: fiscal, grupo: "Fiscal", vista: combo_barras_linea, barras: [{serie: "Resultado primario (Sector Público Nacional)"}, {serie: "Intereses netos de deuda pública", signo: -1}], linea: "Resultado financiero (Sector Público Nacional)", unidad: "millones de $", subtitulo: "Cuánto del resultado primario se lo llevan los intereses de deuda", nota: "Barras: resultado primario del Sector Público Nacional (positivo/negativo según el mes) e intereses netos de deuda pública pagados (mostrados en negativo, como resta visual -- el dato guardado en el histórico no cambia de signo), ambos de la misma fuente (Esquema Ahorro-Inversión-Financiamiento, Secretaría de Hacienda, vía datos.gob.ar). 'Intereses netos' ya excluye los intereses pagados intra-sector público (entre reparticiones del propio Estado), que no representan una salida de caja real del sector público consolidado. Línea de referencia: resultado financiero (= resultado primario menos TODOS los gastos financieros, no sólo estos intereses netos) -- por eso la altura de las barras (primario menos este interés) y la línea no coinciden exactamente mes a mes, son dos recortes metodológicos relacionados pero no idénticos. Aproxima la lógica de un gráfico de cascada sin un plugin de Chart.js no soportado nativamente."}
  # -- Deuda pública bruta: la serie limpia de datos.gob.ar (161.1_TL_DEUDRAL_0_0_28, deuda
  #    externa del gobierno general) está discontinuada desde abr-2024 y sólo cubre deuda
  #    EXTERNA -- no sirve. Se sigue el patrón Excel (boletín mensual de la Secretaría de
  #    Finanzas), mismo criterio que REM/organismos internacionales/morosidad por líneas
  #    (fetch_deuda_bruta en fetchers.py). URL del Excel verificada en vivo (cambia cada mes,
  #    se resuelve scrapeando la página de descarga, no adivinando el nombre del archivo) --
  #    Regla dura #1 aplicada también acá.
  - {nombre: "Deuda pública bruta (Administración Central)", bloque: fiscal, grupo: "Fiscal", fuente: deuda_bruta, unidad: "millones de USD", rezago_normal_dias: 180, nota: "Deuda bruta de la Administración Central (Secretaría de Finanzas, Ministerio de Economía), boletín mensual 'Deuda bruta de la Administración Central', hoja A.1, fila 'A- DEUDA BRUTA ( I + II + III)' -- el total, incluye deuda en situación de pago normal MÁS la que está en proceso de reestructuración/en default. Serie mensual desde 2019, en millones de dólares corrientes (moneda en la que publica la fuente). Los últimos 1-4 meses que el boletín marca como provisorios (con un asterisco '(*)' en la fuente, sujetos a revisión) NO se incluyen: se prefiere mostrar el último dato ya cerrado antes que un número que todavía puede cambiar."}
  - {nombre: "PBI nominal (precios corrientes)", bloque: fiscal, grupo: "Fiscal", fuente: datos_gob, id: "4.4_OGP_2004_T_17", unidad: "millones de $", nota: "PIB a precios de comprador, precios corrientes (INDEC, dataset 'Oferta y Demanda Globales, Base 2004', vía datos.gob.ar), trimestral. A precios CORRIENTES (nominal, no desestacionalizado ni deflactado): es la base que corresponde para un ratio deuda/PBI o cualquier otro ratio sobre el tamaño nominal de la economía -- no confundir con el PBI a precios constantes que se usa para medir crecimiento real."}
  - {nombre: "Deuda pública bruta / PBI", bloque: fiscal, grupo: "Fiscal", calculo: deuda_pbi, pbi_id: "4.4_OGP_2004_T_17", unidad: "% del PBI", rezago_normal_dias: 180, nota: "Deuda pública bruta de la Administración Central (Secretaría de Finanzas, en USD) dividida por el PBI nominal trimestral (INDEC, en pesos) convertido a USD con el tipo de cambio OFICIAL PROMEDIO de cada trimestre (Dólar oficial, ArgentinaDatos) -- decisión metodológica: se usa el promedio trimestral, no el tipo de cambio de cierre, mismo criterio que usan las comparaciones internacionales (FMI y similares), para que un salto puntual del dólar oficial en la fecha de corte no distorsione el ratio de un trimestre entero. La deuda se toma al mes de cierre de cada trimestre (stock a fin de período). No es una serie oficial única: es un cálculo propio a partir de 3 fuentes de frecuencias distintas (deuda mensual, PBI trimestral, dólar diario)."}
  - {nombre: "Deuda/PBI vs. tipo de cambio real", bloque: fiscal, grupo: "Fiscal", vista: overlay, grande: true, series: ["Deuda pública bruta / PBI", "Tipo de cambio real multilateral"], unidad: "índice / % del PBI", nota: "Deuda pública bruta como % del PBI (ver 'Deuda pública bruta / PBI') superpuesta con el Tipo de cambio real multilateral (ya existente en el dashboard). Comparten un solo eje a propósito, sin normalizar a índice 100: los rangos de ambas series son de magnitud similar (Deuda/PBI ~40-90%, TCR ~75-170) así que se leen bien superpuestas sin distorsionar ninguna -- no implica que midan lo mismo ni que compartan unidad, son dos series de magnitud parecida en el mismo gráfico para comparar su evolución en el tiempo, no su nivel."}

# ============================================================================
#  PESTAÑA FINANCIERA (docs/financiera.html) · Ronda 1
#  - Página separada de la macro (docs/index.html), generada por el mismo
#    dashboard.py (generar() con archivo_salida="financiera.html").
#  - 'solo_referencia: true' = NO se vuelve a fetchear (run.py lo saltea):
#    reusa el dato que la lista 'indicadores' de arriba ya trajo con ese mismo
#    'nombre', sólo le agrega una tarjeta bajo bloque: mercados para que
#    también aparezca acá. Evita duplicar requests y filas del CSV.
# ============================================================================
indicadores_financiera:

  - {nombre: "Dólar oficial", bloque: mercados, grupo: "Tipo de cambio y brechas", unidad: "$/USD (venta)", solo_referencia: true}
  - {nombre: "Dólar blue", bloque: mercados, grupo: "Tipo de cambio y brechas", unidad: "$/USD (venta)", solo_referencia: true}
  - {nombre: "Dólar MEP", bloque: mercados, grupo: "Tipo de cambio y brechas", unidad: "$/USD (venta)", solo_referencia: true}
  - {nombre: "Dólar CCL", bloque: mercados, grupo: "Tipo de cambio y brechas", unidad: "$/USD (venta)", solo_referencia: true}
  - {nombre: "Brecha cambiaria (CCL/oficial)", bloque: mercados, grupo: "Tipo de cambio y brechas", unidad: "%", solo_referencia: true, nota: "Brecha calculada como (CCL/oficial - 1) × 100 a partir de cotizaciones diarias de ArgentinaDatos. Mismo indicador que en la pestaña macro, referenciado acá (no se vuelve a fetchear)."}

  - {nombre: "Tasa TAMAR (total bancos)", bloque: mercados, grupo: "Tasas y CER", unidad: "% TNA", desde: "2026-01-01", neutral: true, solo_referencia: true, nota: "TAMAR = Tasa Mayorista Argentina, idVariable 135 (bancos públicos y privados). Mismo indicador que en la pestaña macro, referenciado acá (no se vuelve a fetchear). Para leer los bonos duales (TTM26, TTJ26, etc.) la variante legalmente relevante es OTRA, TAMAR bancos privados (idVariable 44, confirmada contra el texto de las Resoluciones Conjuntas de Finanzas/Hacienda que emiten esos bonos) -- no usar esta tarjeta para ese cálculo."}
  - {nombre: "CER (Coeficiente de Estabilización de Referencia)", bloque: mercados, grupo: "Tasas y CER", fuente: bcra, id_variable: 30, unidad: "índice", desde: "2024-01-01", neutral: true, nota: "Coeficiente de Estabilización de Referencia (base 2.2.2002=1), API de Estadísticas Monetarias del BCRA v4.0 (idVariable 30, 'Principales Variables'), diario. Usado para ajustar contratos/bonos indexados por inflación (ej. lectura de bonos duales TAMAR vs. CER)."}

  - {nombre: "S&P MERVAL", bloque: mercados, grupo: "Acciones", fuente: byma, symbol: "M", unidad: "puntos", desde: "2024-01-01", sube_es_bueno: true, nota: "Índice S&P MERVAL (símbolo 'M'), serie histórica diaria de BYMA (open.bymadata.com.ar, endpoint público sin auth). El certificado de BYMA tiene una CA intermedia fuera del bundle estándar de certifi: el fetcher pide con verify=False (conexión sigue siendo TLS, sólo se salta la validación de cadena), mismo criterio que las librerías públicas de BYMA (pyhomebroker, bymadata)."}

