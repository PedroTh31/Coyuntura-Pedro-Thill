name: Mail de coyuntura (lun-vie, 8am Argentina)

on:
  schedule:
    # 11:00 UTC = 8:00 Argentina (UTC-3, sin horario de verano). GitHub Actions no garantiza
    # el minuto exacto de disparo de un cron: en horas pico puede haber demoras de 10 a 60+
    # minutos, sin forma de eliminar esa variabilidad desde este lado -- por eso el mail puede
    # llegar un poco más tarde algunos días, no es un bug.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Actualizar datos
        run: python run.py
      - name: Enviar el mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python enviar_mail.py
