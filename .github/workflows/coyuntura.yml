name: Actualizar coyuntura

on:
  # Disparo PRINCIPAL: externo, desde cron-job.org a las 06:30 AR (media hora antes del mail),
  # vía la API de workflow_dispatch. Ver docs_internos/DISPARO_EXTERNO.md.
  workflow_dispatch:
  schedule:
    # Respaldo: 09:53 UTC = 06:53 AR, fuera del :00 a propósito. El cron de GitHub viene
    # arrancando con horas de demora, por eso no es el disparo principal.
    - cron: "53 9 * * *"

permissions:
  contents: write

concurrency:
  # Disparo externo + respaldo no corren en paralelo (los dos commitean data/ y docs/).
  group: coyuntura-datos
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # log en vivo: si un paso se corta por timeout, se ve en qué fuente estaba

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Registrar disparo
        run: echo "Disparado por ${{ github.event_name }} · $(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M:%S') AR"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Verificar calendario de publicaciones
        # Baja el calendario del INDEC (caché en data/calendario_indec.json) y chequea feriados;
        # avisa a Pedro si algo cambió. Nunca corta el pipeline de datos. Corre ANTES de run.py
        # (Bloque B3): la línea de frescura del dashboard y la agenda del mail usan la caché de hoy.
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python verificar_calendario.py
      - name: Correr el pipeline
        # run.py escribe data/ultima_corrida.json al terminar: el mail lo usa para decidir
        # si manda con estos datos o corre run.py de nuevo como fallback.
        # INDEC_API_TOKEN: API del INDEC (fuente primaria de las series del INDEC; nunca se
        # imprime). GMAIL_*: sólo para las alertas a Pedro (token vencido/por vencer, fallback,
        # publicaciones atrasadas del Bloque B3).
        env:
          INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}
          INDEC_TOKEN_FECHA: ${{ vars.INDEC_TOKEN_FECHA }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python run.py
      - name: Commitear datos actualizados
        run: |
          git config user.name  "coyuntura-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "Sin cambios hoy."
            exit 0
          fi
          git commit -m "Datos coyuntura $(TZ=America/Argentina/Buenos_Aires date +'%Y-%m-%d')"
          # El workflow del mail puede pushear data/mail_enviado.json en el medio: rebasear.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
