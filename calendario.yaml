# calendario.yaml — Bloque B (frescura de cada dato y calendario), PROMPT_ronda_macro_indec.md.
#
# Guarda SÓLO lo estable (diseño de Pedro, 07/11/2026):
#   1. qué publicación del INDEC alimenta qué indicadores, con el patrón de título que la identifica;
#   2. los feriados.
# Las FECHAS de publicación NO van acá: se bajan del calendario oficial en cada corrida
# (calendario_indec.py), con caché en data/ y fallback al último caché válido, marcado como tal.
#
# Calendario oficial de difusión del INDEC: https://www.indec.gob.ar/indec/web/Calendario-Fecha-0
# Esa página arma cada mes con https://www.indec.gob.ar/Calendario/FiltrosCalendario/mes/{Mes}-{AAAA}/0
# (no documentado, devuelve HTML; ver el docstring de calendario_indec.py).

fuente:
  pagina: "https://www.indec.gob.ar/indec/web/Calendario-Fecha-0"
  # Meses a bajar en cada corrida: el actual + 4 (alcanza para la próxima fecha de las trimestrales).
  meses_a_bajar: 5
  # Meses ANTERIORES al actual que también se bajan: la línea de frescura del dashboard (frescura.py)
  # necesita saber qué períodos ya se publicaron para marcar "atrasado". 4 alcanza para las
  # trimestrales (la publicación anterior a la vigente puede ser de hace ~3 meses).
  meses_atras: 4

# Publicaciones del INDEC que alimentan indicadores del dashboard (decisión de Pedro: sólo esas).
#  - titulo_regex: se aplica al título tal cual lo publica el INDEC; el grupo `periodo` es el período
#    de referencia ("Octubre de 2026", "Tercer trimestre de 2026"). Verificados contra los 13 meses
#    cargados el 07/11/2026 (sep-2026 a sep-2027): cada patrón matchea exactamente una publicación
#    por mes (mensuales) o por trimestre (trimestrales), y ningún otro título.
#  - meses_siguientes_alerta: si ni en el mes actual ni en los N meses siguientes aparece una fecha
#    que matchee, se alerta a Pedro (posible cambio de título). Mensuales: 1; trimestrales: 3 (Pedro).
#  - indicadores: `nombre` exacto en indicadores.yaml. Un indicador va acá sólo si ESTA publicación
#    es la que agrega su período nuevo (la de mayor rezago entre sus componentes).
#  - nombre_corto: cómo se nombra en el mail diario ("IPC de octubre", "Mercado de trabajo (EPH) del
#    tercer trimestre") y en sus avisos de atrasado (Bloque B3).
#  - apertura: el bloque "Dato nuevo" que abre el mail el primer día en que el período nuevo está en el
#    dashboard (Bloque B3, decisión D3 de Pedro, 07/11/2026). Sólo series que el dashboard ya calcula
#    (`serie` = `nombre` de indicadores.yaml); el mail no calcula series propias.
#      titular: plantilla descriptiva (nunca causas): {periodo} (en prosa), {valor} (valor de la primera
#               fila), {var} (su variación con signo), {ref} (período de comparación de la primera fila);
#      filas: [{serie, etiqueta, unidad: "%"|"USD M"|"", compara: anterior|interanual,
#               variacion: pp|pct|dif}]; una fila sin dato para el período se omite;
#      serie_periodo: la serie que fija el período de la publicación (default: la de la primera fila);
#      detalle: línea fija opcional bajo el titular (para publicaciones sin filas);
#    Sin fila del REM (decisión de Pedro: fuera del B3, ver docs_internos/PENDIENTES.md). Aclaración (F1,
#    09/11/2026): la FECHA de publicación del REM sí figura en el calendario, como evento del BCRA (bloque
#    `externos:` más abajo), sin frescura ni "Dato nuevo"; esta decisión del B3 no cambia.
publicaciones:
  - id: ipc
    nombre: "IPC (cobertura nacional)"
    nombre_corto: "IPC"
    titulo_regex: '^Índice de precios al consumidor \(IPC\)\. Cobertura nacional\. (?P<periodo>.+)$'
    frecuencia: mensual
    meses_siguientes_alerta: 1
    apertura:
      titular: "Inflación de {periodo}: {valor} mensual"
      filas:
        - {serie: "Inflación mensual (IPC)", etiqueta: "Mensual", unidad: "%", compara: anterior, variacion: pp}
        - {serie: "Inflación interanual (IPC)", etiqueta: "Interanual", unidad: "%", compara: anterior, variacion: pp}
        - {serie: "IPC Núcleo (var. mensual)", etiqueta: "Núcleo", unidad: "%", compara: anterior, variacion: pp}
    indicadores:
      - "Inflación mensual (IPC)"
      - "Inflación interanual (IPC)"
      - "IPC Núcleo (var. mensual)"
      - "IPC Regulados (var. mensual)"
      - "IPC Estacionales (var. mensual)"
      - "IPC división: Alimentos y bebidas no alcohólicas"
      - "IPC división: Bebidas alcohólicas y tabaco"
      - "IPC división: Prendas de vestir y calzado"
      - "IPC división: Vivienda, agua, electricidad y otros combustibles"
      - "IPC división: Equipamiento y mantenimiento del hogar"
      - "IPC división: Salud"
      - "IPC división: Transporte"
      - "IPC división: Comunicación"
      - "IPC división: Recreación y cultura"
      - "IPC división: Educación"
      - "IPC división: Restaurantes y hoteles"
      - "IPC división: Bienes y servicios varios"
      - "Tasa de interés real (TAMAR - inflación interanual)"   # TAMAR es diaria: el IPC fija el período

  - id: salarios
    nombre: "Índice de salarios"
    nombre_corto: "Índice de salarios"
    titulo_regex: '^Índice de salarios\. (?P<periodo>.+)$'
    frecuencia: mensual
    meses_siguientes_alerta: 1
    apertura:
      titular: "Salario real de {periodo}: {var} contra {ref}"
      filas:
        - {serie: "Salario real (deflactado por IPC)", etiqueta: "Salario real (índice)", unidad: "", compara: anterior, variacion: pct}
    indicadores:   # salario real = salarios ÷ IPC; los salarios salen con más rezago que el IPC
      - "Salario real (deflactado por IPC)"
      - "Salario real registrado - sector privado"
      - "Salario real registrado - sector público"
      - "Salario real no registrado - sector privado"

  - id: emae
    nombre: "EMAE"
    nombre_corto: "EMAE"
    titulo_regex: '^Estimador mensual de actividad económica \(EMAE\)\. (?P<periodo>.+)$'
    frecuencia: mensual
    meses_siguientes_alerta: 1
    apertura:
      # Interanual: la serie del dashboard es la original (sin desestacionalizar); contra el mes
      # anterior mostraría estacionalidad (decisión D3 de Pedro).
      titular: "EMAE de {periodo}: {var} interanual"
      filas:
        - {serie: "EMAE (actividad económica)", etiqueta: "Índice (2004=100)", unidad: "", compara: interanual, variacion: pct}
    indicadores:
      - "EMAE (actividad económica)"
      - "EMAE · Agricultura, ganadería y silvicultura"
      - "EMAE · Pesca"
      - "EMAE · Explotación de minas y canteras"
      - "EMAE · Industria manufacturera"
      - "EMAE · Electricidad, gas y agua"
      - "EMAE · Construcción"
      - "EMAE · Comercio mayorista y minorista"
      - "EMAE · Hoteles y restaurantes"
      - "EMAE · Transporte y comunicaciones"
      - "EMAE · Intermediación financiera"
      - "EMAE · Inmobiliarias y empresariales"
      - "EMAE · Administración pública y defensa"
      - "EMAE · Enseñanza"
      - "EMAE · Servicios sociales y de salud"
      - "EMAE · Otros servicios comunitarios"
      - "EMAE · Impuestos netos de subsidios"

  - id: ica
    nombre: "Intercambio comercial argentino (ICA)"
    nombre_corto: "Comercio exterior (ICA)"
    titulo_regex: '^Intercambio comercial argentino \(ICA\)\. Bienes\. (?P<periodo>.+)$'
    frecuencia: mensual
    meses_siguientes_alerta: 1
    apertura:
      titular: "Saldo comercial de {periodo}: {valor}"
      filas:   # interanual por estacionalidad (decisión D3 de Pedro)
        - {serie: "Saldo comercial", etiqueta: "Saldo", unidad: "USD M", compara: interanual, variacion: dif}
        - {serie: "Exportaciones totales", etiqueta: "Exportaciones", unidad: "USD M", compara: interanual, variacion: pct}
        - {serie: "Importaciones totales", etiqueta: "Importaciones", unidad: "USD M", compara: interanual, variacion: pct}
    indicadores:
      - "Exportaciones totales"
      - "Importaciones totales"
      - "Saldo comercial"
      - "Balance comercial energético"
      - "Productos primarios"
      - "Manufacturas de origen agropecuario (MOA)"
      - "Manufacturas de origen industrial (MOI)"
      - "Combustibles y energía"
      - "Bienes de capital"
      - "Bienes intermedios"
      - "Combustibles y lubricantes"
      - "Piezas y accesorios para bienes de capital"
      - "Bienes de consumo"
      - "Vehículos automotores de pasajeros"
      - "Resto (importaciones por uso)"

  - id: mercado_trabajo
    nombre: "Mercado de trabajo (EPH)"
    nombre_corto: "Mercado de trabajo (EPH)"
    # No confundir con "Encuesta permanente de hogares (EPH) total urbano. Principales tasas ..."
    # (otra publicación, cobertura total urbano): el patrón no la matchea.
    titulo_regex: '^Mercado de trabajo\. Tasas e indicadores socioeconómicos(?: \(EPH\))?\. (?P<periodo>.+)$'
    frecuencia: trimestral
    meses_siguientes_alerta: 3   # mar/jun/sep/dic: desde fines de dic, la próxima es en marzo
    apertura:
      titular: "Desempleo del {periodo}: {valor}"
      filas:   # contra el mismo trimestre del año anterior (decisión D3 de Pedro)
        - {serie: "Tasa de desempleo", etiqueta: "Desempleo", unidad: "%", compara: interanual, variacion: pp}
        - {serie: "Tasa de informalidad laboral (asalariados sin descuento jubilatorio)", etiqueta: "Informalidad", unidad: "%", compara: interanual, variacion: pp}
    indicadores:
      - "Tasa de desempleo"
      # Verificado el 07/11/2026: el informe "Mercado de trabajo... Segundo trimestre de 2026"
      # (indec.gob.ar/uploads/informesdeprensa/mercado_trabajo_eph_2trim26433FCBC5A8.pdf, p. 10,
      # "Asalariados - Sin descuento jubilatorio (informal)") publica 37,7 / 36,7 / 36,3 / 37,9 / 37,9
      # para 2T-25 a 2T-26, idénticos a 52.2_ASDJ_0_0_37 (×100).
      - "Tasa de informalidad laboral (asalariados sin descuento jubilatorio)"

  - id: informe_avance
    nombre: "Informe de avance del nivel de actividad"
    nombre_corto: "Informe de avance del nivel de actividad"
    titulo_regex: '^Informe de avance del nivel de actividad\. (?P<periodo>.+)$'
    frecuencia: trimestral
    meses_siguientes_alerta: 3
    apertura:
      # Sin variación: el PBI nominal contra el trimestre anterior no dice nada con esta inflación
      # (decisión D3 de Pedro).
      titular: "Informe de avance del {periodo}: se incorporó al dashboard"
      serie_periodo: "PBI nominal (precios corrientes)"
      detalle: "PBI nominal y deuda pública bruta / PBI, actualizados al {periodo_corto}."
      filas: []
    indicadores:   # oferta y demanda globales a precios corrientes (4.4_OGP_2004_T_17)
      - "PBI nominal (precios corrientes)"
      - "Deuda pública bruta / PBI"   # la deuda es mensual: el PBI trimestral fija el período

# Indicadores con componentes del INDEC que NO van en una publicación (quedan "sin calendario
# oficial"), porque su período lo fija un componente sin calendario:
#  - "RIPTE medido en canastas básicas (CBT, GBA)": RIPTE (Secretaría de Trabajo, sin calendario: sólo dice
#    "hasta 45 días de finalizado el período", que es un plazo, no una fecha); la CBT sí es del INDEC
#    ("Valorización mensual de la canasta básica...", sale con el IPC).
#  - "Préstamos al sector privado, variación % real mensual", "Adelantos transitorios / Transferencia
#    de utilidades (pesos constantes)": BCRA + IPC. Decisión de Pedro (07/11/2026): no se asocian.
#    La regla de "mayor rezago" no se cumple: en el historial del bot (jul-nov 2026) los préstamos
#    salieron DESPUÉS que el IPC en jun-2026 y sep-2026, y adelantos/transferencias están frenados
#    en may-2026.

# Calendario ampliado (Bloque F1, decisiones de Pedro del 09/11/2026). Eventos de otros organismos que NO
# alimentan series del dashboard: no tienen período ni frescura ("al día"/"atrasado"), sólo fecha. Los baja
# verificar_calendario.py (calendario_externo.py + un parser por organismo: cal_fed.py, cal_bce.py, cal_boj.py,
# cal_boe.py, cal_bcra.py) a data/calendario_externo.json; una descarga fallida nunca pisa la caché.
#  - Primera versión: decisiones de tasa de la FED (FOMC), el BCE, el BoJ y el BoE, más el IPOM y el REM del
#    BCRA (anunciados, a futuro). Fuera: Beige Book, MPR, General Council, reuniones no monetarias del BCE y el
#    resto de las publicaciones del BCRA. BLS y FMI: fuera del F1 (bloqueo anti-bot, PENDIENTES).
#  - Publicados (hacia atrás, sólo en /calendario/, no en el mail): FED, statement y minutas del FOMC, del RSS
#    oficial. Un statement se une con la decisión anunciada del mismo día (hora del Este de EE.UU.). Un
#    anunciado pasado sin publicación se muestra con el rótulo "anunciado", sin link y sin afirmar que pasó.
#  - Horas, decisión de Pedro (09/11/2026): la FED en hora del Este de EE.UU. (America/New_York) y el BoJ en
#    JST (Asia/Tokyo), aunque sus páginas no escriban la zona. Se muestra "16:00 AR (14:00 ET)" (zoneinfo,
#    con horario de verano). Si la fuente no da hora, va sin hora: nunca estimada.
#  - Van al mail ("Hoy se publica", "Esta semana") y a /calendario/, siempre visibles con el rótulo del
#    organismo, sin checkbox.
#  - El REM entra sólo como evento de calendario, sin frescura (ver la nota "Sin fila del REM" arriba: la
#    decisión del B3 sobre el "Dato nuevo" no cambia).
#  - meses_alerta: si no hay ningún evento futuro anunciado entre hoy y esos meses, aviso semanal a Pedro.
externos:
  - id: fed
    organismo: "FED"
    zona: "America/New_York"
    zona_abrev: "ET"
    meses_alerta: 3
    # Fechas de las reuniones: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm (sin hora).
    # Hora de la decisión: la página del mes (índice en https://www.federalreserve.gov/newsevents/calendar.htm,
    # fila "FOMC Meeting"); sólo existe para el mes actual y el siguiente.
    url: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
    url_indice_mes: "https://www.federalreserve.gov/newsevents/calendar.htm"
    eventos:
      - {tipo: decision, titulo: "Decisión de tasa (FOMC)"}
    # RSS oficial de comunicados de política monetaria (https://www.federalreserve.gov/feeds/feeds.htm).
    publicados:
      url: "https://www.federalreserve.gov/feeds/press_monetary.xml"
      tipos:
        - {tipo: decision, titulo: "Decisión de tasa (FOMC)", regex: "^Federal Reserve issues FOMC statement"}
        - {tipo: minutas, titulo: "Minutas del FOMC", regex: "^Minutes of the Federal Open Market Committee"}
  - id: bce
    organismo: "BCE"
    zona: "Europe/Berlin"
    meses_alerta: 3
    url: "https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html"
    eventos:
      - {tipo: decision, titulo: "Decisión de tasa (BCE)",
         regex: "^Governing Council of the ECB: monetary policy meeting\\b.*\\(Day 2\\)"}
  - id: boj
    organismo: "BoJ"
    zona: "Asia/Tokyo"
    zona_abrev: "JST"
    meses_alerta: 3
    # Columna "Date of MPM": la decisión es el último día de la reunión ("immediately after", sin hora).
    url: "https://www.boj.or.jp/en/mopo/mpmsche_minu/index.htm"
    eventos:
      - {tipo: decision, titulo: "Decisión de tasa (BoJ)"}
  - id: boe
    organismo: "BoE"
    zona: "Europe/London"
    meses_alerta: 3
    # "MPC announcements on Bank Rate": un anuncio por fila de "<año> confirmed dates" (sin hora).
    url: "https://www.bankofengland.co.uk/monetary-policy/upcoming-mpc-dates"
    eventos:
      - {tipo: decision, titulo: "Decisión de tasa (BoE)"}
  - id: bcra
    organismo: "BCRA"
    zona: "America/Argentina/Buenos_Aires"
    meses_alerta: 2
    # Calendario de informes del BCRA (tabla "Publicaciones | Fecha", sin hora). El IPOM figura con dos
    # nombres ("Informe de Política Monetaria (IPOM)" e "Informe de Política Monetaria").
    url: "https://www.bcra.gob.ar/calendario-de-informes/"
    eventos:
      - {tipo: rem, titulo: "Relevamiento de Expectativas de Mercado (REM)",
         regex: "^Relevamiento de Expectativas de Mercado\\b"}
      - {tipo: ipom, titulo: "Informe de Política Monetaria (IPOM)", regex: "^Informe de Política Monetaria\\b"}

# Feriados: días no hábiles para "próximo día hábil" (series diarias) y para "fecha + 1 día hábil"
# (criterio de atrasado). Criterio de Pedro: cuenta un día si en él NO operan el INDEC, el BCRA y
# BYMA. Eso incluye los feriados nacionales (inamovibles, trasladables y turísticos) y los
# especiales que la norma extiende a esos organismos. NO cuentan los "días no laborables"
# religiosos (optativos) ni los feriados de jurisdicciones donde esos organismos operan igual.
#  - 2026: verificado el 07/11/2026 contra https://www.argentina.gob.ar/feriados (los 20 nacionales
#    coinciden con ArgentinaDatos /v1/feriados/2026).
#  - 10/11/2026 (especial): Decreto DNU 1103/2026, art. 3 (feriado en Córdoba y CABA; los
#    considerandos lo extienden a "los organismos, dependencias y actividades sujetos a jurisdicción
#    nacional que desarrollan sus funciones en los territorios comprendidos"),
#    https://www.boletinoficial.gob.ar/detalleAviso/primera/348022/20260928 ; BCRA: feriado bancario
#    en todo el país, Comunicación "A" 8487 (01/10/2026),
#    https://www.bcra.gob.ar/Pdfs/comytexord/A8487.pdf ; BYMA lo lista en su calendario bursátil
#    "según el Decreto 1.103/26", https://www.byma.com.ar/en/market/calendario-bursatil .
#  - 09/11/2026 (inamovible): Decreto DNU 1103/2026, art. 2, "feriado nacional el día lunes 9 de noviembre
#    de 2026 en todo el territorio de la República", https://www.argentina.gob.ar/normativa/nacional/norma-430580/texto
#    (verificado el 07/11/2026; también en el JSON oficial de argentina.gob.ar/feriados y en ArgentinaDatos).
#  - 11/11/2026 (sólo Provincia de Buenos Aires, art. 4): NO cuenta. El INDEC publica ese día (ISSP
#    en su calendario) y no hay feriado bancario.
#  - 2027: argentina.gob.ar todavía no publica 2027. Provisorio, de ArgentinaDatos /v1/feriados/2027
#    (verificado: false). verificar_calendario.py lo cruza contra la oficial cuando aparezca.
feriados:
  "2026":
    verificado: true
    fechas:
      - {fecha: "2026-01-01", tipo: inamovible, nombre: "Año Nuevo"}
      - {fecha: "2026-02-16", tipo: inamovible, nombre: "Carnaval"}
      - {fecha: "2026-02-17", tipo: inamovible, nombre: "Carnaval"}
      - {fecha: "2026-03-23", tipo: turistico, nombre: "Día no laborable con fines turísticos"}
      - {fecha: "2026-03-24", tipo: inamovible, nombre: "Día Nacional de la Memoria por la Verdad y la Justicia"}
      - {fecha: "2026-04-02", tipo: inamovible, nombre: "Día del Veterano y de los Caídos en la Guerra de Malvinas"}
      - {fecha: "2026-04-03", tipo: inamovible, nombre: "Viernes Santo Festividad Cristiana"}
      - {fecha: "2026-05-01", tipo: inamovible, nombre: "Día del Trabajador"}
      - {fecha: "2026-05-25", tipo: inamovible, nombre: "Día de la Revolución de Mayo"}
      - {fecha: "2026-06-15", tipo: trasladable, nombre: "Paso a la Inmortalidad del Gral. Don Martín Miguel de Güemes (17/6)"}
      - {fecha: "2026-06-20", tipo: inamovible, nombre: "Paso a la Inmortalidad del Gral. Manuel Belgrano"}
      - {fecha: "2026-07-09", tipo: inamovible, nombre: "Día de la Independencia"}
      - {fecha: "2026-07-10", tipo: turistico, nombre: "Día no laborable con fines turísticos"}
      - {fecha: "2026-08-17", tipo: trasladable, nombre: "Paso a la Inmortalidad del Gral. José de San Martín"}
      - {fecha: "2026-10-12", tipo: trasladable, nombre: "Día de la Raza"}
      - {fecha: "2026-11-09", tipo: inamovible, nombre: "Visita de Su Santidad el Papa León XIV (Decreto 1103/2026 art. 2)"}
      - {fecha: "2026-11-10", tipo: especial, nombre: "Visita de Su Santidad el Papa León XIV (Decreto 1103/2026 art. 3; feriado bancario BCRA A 8487; BYMA)"}
      - {fecha: "2026-11-23", tipo: trasladable, nombre: "Día de la Soberanía Nacional (20/11)"}
      - {fecha: "2026-12-07", tipo: turistico, nombre: "Día no laborable con fines turísticos"}
